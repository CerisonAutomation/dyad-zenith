name: Zenith Electron Build Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - ".nvmrc"
      - ".bun-version"
      - "bun.lock"
      - "forge.config.ts"
      - "vite*.mts"
      - "native/**"
      - "src/**"
      - "worker/**"
      - "workers/**"
      - "scaffold/**"
      - "scripts/electron-build-doctor.mjs"
      - "scripts/verify-zenith.mjs"
      - "src/lib/packaging_cleanup.ts"
      - "scripts/verify-electron-package.mjs"
      - ".github/workflows/zenith-electron-build.yml"

concurrency:
  group: zenith-electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-14
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          package-manager-cache: false
      - name: Use Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Reproducible install
        run: bun ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Electron build doctor
        run: bun run doctor:electron -- --installed
      - name: Zenith policy gate
        run: bun run verify:zenith
      - name: Typecheck
        run: bun run ts
      - name: Tests
        run: bun run test
      - name: Package unsigned Electron app
        run: bun run package:unsigned
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify packaged runtime
        run: bun run verify:electron-package
      - name: Upload packaged app
        uses: actions/upload-artifact@v7
        with:
          name: dyad-${{ matrix.os }}
          path: out/dyad-*
          retention-days: 3
